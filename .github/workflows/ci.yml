name: GTNIC Agent CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip check
          playwright install --with-deps chromium

      - name: Verify requirements can resolve
        run: python -m pip install --dry-run --ignore-installed -r backend/requirements.txt

      - name: Backend import checks
        env:
          PYTHONPATH: backend
        run: |
          python -c "import src.api; import src.carousel.pipeline; import src.reels.pipeline; import src.carousel.tools.cloudflare_pose_generator"

      - name: Backend lint
        run: |
          python -m pip install ruff
          ruff check backend/src backend/tests

      - name: Run Pytest
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend Build
        working-directory: frontend
        run: npm run build
